name: Deploy Gym Worker to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.GCP_SA_KEY }}"

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker europe-southwest1-docker.pkg.dev --quiet

      - name: Build and push
        run: |
          docker build -t europe-southwest1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/gym/gym-worker .
          docker push europe-southwest1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/gym/gym-worker

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: gym-worker
          image: europe-southwest1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/gym/gym-worker
          region: europe-southwest1
          flags: |
            --allow-unauthenticated
            --timeout=10m
            --memory=2Gi
            --cpu=1
            --set-secrets=WORKER_API_KEY=GYM_WORKER_API_KEY:latest,HUB_URL=HUB_URL:latest
