name: Deploy Gym Worker to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: saxa-491514
  REGION: europe-southwest1
  SERVICE: gym-worker
  IMAGE: europe-southwest1-docker.pkg.dev/saxa-491514/gym/gym-worker

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for Workload Identity Federation

    steps:
      - uses: actions/checkout@v4

      # Keyless auth: the org policy forbids service-account keys, so GitHub OIDC
      # impersonates the deployer SA via Workload Identity Federation.
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/456617956990/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deployer@saxa-491514.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - name: Build and push
        run: |
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          image: ${{ env.IMAGE }}
          region: ${{ env.REGION }}
          flags: |
            --allow-unauthenticated
            --timeout=10m
            --memory=2Gi
            --cpu=1
            --set-secrets=WORKER_API_KEY=GYM_WORKER_API_KEY:latest,HUB_URL=HUB_URL:latest
